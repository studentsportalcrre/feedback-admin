<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SIR C.R. REDDY COLLEGE OF ENGINEERING - Feedback Admin - Questions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #0d6efd;
      --primary-dark: #004aad;
      --secondary: #f8f9fa;
      --accent: #ffd45b;
      --text-dark: #1e2a38;
      --text-light: #ffffff;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      background: linear-gradient(to bottom right, #f0f4ff, #ffffff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-dark);
      padding-bottom: 70px;
    }

    .college-header {
      background: linear-gradient(90deg, var(--primary-dark), var(--primary));
      color: var(--text-light);
      text-align: center;
      padding: 25px 0;
      position: relative;
      box-shadow: 0 3px 8px var(--shadow);
    }

    .college-header img {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      height: 70px;
      object-fit: contain;
      background-color: #fff;
      border-radius: 50%;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .college-header h2 {
      font-weight: 700;
      margin: 0;
      font-size: 1.9rem;
    }

    .navbar {
      background-color: var(--primary);
      box-shadow: 0 2px 6px var(--shadow);
      padding: 0.7rem 1rem;
    }

    .navbar-brand {
      color: var(--text-light) !important;
      font-weight: 600;
    }

    .navbar-nav .nav-link {
      color: var(--text-light) !important;
      font-weight: 500;
      margin-right: 18px;
      border-radius: 5px;
      padding: 0.45rem 0.9rem;
      transition: 0.3s;
    }

    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
      background-color: rgba(255, 255, 255, 0.15);
      color: var(--accent) !important;
    }

    .content {
      margin-top: 70px;
      max-width: 950px;
      margin-left: auto;
      margin-right: auto;
      padding: 30px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: 0 8px 25px var(--shadow);
      backdrop-filter: blur(10px);
      animation: fadeInUp 1.2s ease forwards;
    }

    .content h3 {
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 30px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 25px;
    }

    .input-group-text {
      font-weight: 600;
      background-color: var(--primary);
      color: white;
    }

    #addQuestion {
      background-color: var(--primary-dark);
      color: white;
      font-weight: 500;
      transition: 0.3s ease;
    }

    #addQuestion:hover {
      background-color: var(--primary);
      transform: scale(1.05);
    }

    table.table {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 0 12px rgba(13, 110, 253, 0.15);
      overflow: hidden;
    }

    table thead.table-primary {
      background-color: var(--primary-dark) !important;
      color: white !important;
    }

    table th,
    table td {
      vertical-align: middle !important;
      padding: 0.75rem;
      font-size: 0.9rem;
    }

    table td .btn {
      transition: all 0.2s ease;
    }

    table td .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .fade-in {
      opacity: 0;
      animation: fadeInUp 1.2s ease forwards;
    }

    @keyframes fadeInUp {
      0% {
        transform: translateY(30px);
        opacity: 0;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    footer {
      background: var(--primary-dark);
      color: var(--text-light);
      text-align: center;
      padding: 12px 15px;
      position: fixed;
      width: 100%;
      bottom: 0;
      font-size: 0.9rem;
      box-shadow: 0 -2px 6px var(--shadow);
      letter-spacing: 0.3px;
      z-index: 999;
    }
  </style>
</head>

<body>
  <header class="college-header">
    <img src="college_logo.png" alt="College Logo" />
    <h2>SIR C.R. REDDY COLLEGE OF ENGINEERING</h2>
  </header>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="index.html">Feedback Admin Panel</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
          <li class="nav-item"><a class="nav-link" href="adminpanel.html">👨‍🏫 Staff Allocation</a></li>
          <li class="nav-item"><a class="nav-link" href="consolidate.html">📊 Consolidate Report</a></li>
          <li class="nav-item"><a class="nav-link active" href="questions.html">📝 Questions</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="content fade-in">
    <h3>📝 Manage Feedback Questions</h3>

    <!-- Add Question -->
    <div class="input-group mb-3">
      <span class="input-group-text">New Question</span>
      <input type="text" id="newQuestion" class="form-control" placeholder="Enter question text" />
      <button class="btn" id="addQuestion">➕ Add</button>
    </div>

    <!-- Questions Table -->
    <div class="table-responsive">
      <table class="table table-bordered text-center align-middle" id="questionsTable">
        <thead class="table-primary">
          <tr>
            <th style="width:8%">#</th>
            <th style="width:60%">Question</th>
            <th style="width:16%">Edit</th>
            <th style="width:16%">Delete</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 SIR C.R. REDDY COLLEGE OF ENGINEERING | Feedback Management System</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const API_BASE = "https://feedbackadmin.onrender.com//admin";

    async function loadQuestions() {
      const tbody = document.querySelector("#questionsTable tbody");
      tbody.innerHTML = `<tr><td colspan="4">Loading...</td></tr>`;

      try {
        const res = await fetch(`${API_BASE}/questions`);
        const data = await res.json();

        tbody.innerHTML = "";
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4">No questions found.</td></tr>`;
          return;
        }

        data.forEach((q) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${q.question_number}</td>
            <td>
              <span class="question-text">${q.question}</span>
              <input type="text" class="form-control edit-input d-none" value="${q.question}">
            </td>
            <td>
              <button class="btn btn-warning btn-sm editBtn" data-id="${q.id}">✏️ Edit</button>
              <button class="btn btn-success btn-sm saveBtn d-none" data-id="${q.id}">💾 Save</button>
            </td>
            <td>
              <button class="btn btn-danger btn-sm deleteBtn" data-id="${q.id}">🗑️ Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="4">Failed to load questions.</td></tr>`;
      }
    }

    document.getElementById("addQuestion").addEventListener("click", async () => {
      const question = document.getElementById("newQuestion").value.trim();
      if (!question) return Swal.fire("⚠️ Error", "Please enter a question", "warning");

      try {
        const res = await fetch(`${API_BASE}/questions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const result = await res.json();
        if (result.success) {
          Swal.fire("✅ Added", result.message, "success");
          document.getElementById("newQuestion").value = "";
          loadQuestions();
        } else {
          Swal.fire("❌ Error", result.message, "error");
        }
      } catch {
        Swal.fire("⚠️ Failed", "Server not reachable", "warning");
      }
    });

    document.addEventListener("click", async (e) => {
      if (e.target.classList.contains("editBtn")) {
        const row = e.target.closest("tr");
        row.querySelector(".question-text").classList.add("d-none");
        row.querySelector(".edit-input").classList.remove("d-none");
        e.target.classList.add("d-none");
        row.querySelector(".saveBtn").classList.remove("d-none");
      }

      if (e.target.classList.contains("saveBtn")) {
        const row = e.target.closest("tr");
        const id = e.target.dataset.id;
        const newQuestion = row.querySelector(".edit-input").value.trim();
        if (!newQuestion) return Swal.fire("⚠️ Error", "Question cannot be empty", "warning");

        try {
          const res = await fetch(`${API_BASE}/questions/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: newQuestion }),
          });
          const result = await res.json();

          if (result.success) {
            Swal.fire("✅ Updated", result.message, "success");
            loadQuestions();
          } else {
            Swal.fire("❌ Error", result.message, "error");
          }
        } catch {
          Swal.fire("⚠️ Failed", "Server not reachable", "warning");
        }
      }

      if (e.target.classList.contains("deleteBtn")) {
        const id = e.target.dataset.id;
        const confirm = await Swal.fire({
          title: "Are you sure?",
          text: "This question will be deleted permanently!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Yes, delete it!",
        });
        if (!confirm.isConfirmed) return;

        try {
          const res = await fetch(`${API_BASE}/questions/${id}`, { method: "DELETE" });
          const result = await res.json();

          if (result.success) {
            Swal.fire("✅ Deleted", result.message, "success");
            loadQuestions();
          } else {
            Swal.fire("❌ Error", result.message, "error");
          }
        } catch {
          Swal.fire("⚠️ Failed", "Server not reachable", "warning");
        }
      }
    });

    loadQuestions();
  </script>
</body>

</html>
